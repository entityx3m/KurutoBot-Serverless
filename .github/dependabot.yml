version: 2
updates:
  # npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    reviewers:
      - "Kuruto" # Replace with your GitHub username
    versioning-strategy: "auto"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
      discord:
        patterns:
          - "discord.js"
          - "discord-api-types"
          - "discord-interactions"
      supabase:
        patterns:
          - "@supabase/*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (if any)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"